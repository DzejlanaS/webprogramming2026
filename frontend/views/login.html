<div class="container py-5">
  <div class="auth-card card card-petly p-4 p-md-5">
    <h1 class="h4 text-center mb-1">Welcome Back</h1>
    <p class="text-muted text-center small mb-4">Log in to your Petly account</p>

    <form class="js-placeholder-form" novalidate>
      <div class="mb-3">
        <label class="form-label small">Email Address</label>
        <input type="email" class="form-control" required />
      </div>
      <div class="mb-3">
        <label class="form-label small">Password</label>
        <input type="password" class="form-control" required />
      </div>
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMe" />
          <label class="form-check-label small" for="rememberMe">Remember me</label>
        </div>
        <a href="#" class="small text-petly-primary">Forgot password?</a>
      </div>

      <div class="alert alert-light border small js-placeholder-note d-none">
        <i class="bi bi-info-circle"></i>
        Login will be connected to the backend (with JWT) in Milestone 4.
      </div>

      <button type="submit" class="btn btn-petly-primary w-100 mb-3">Log In</button>
      <p class="text-center small text-muted mb-0">
        Don't have an account? <a href="#/register" class="text-petly-primary">Register</a>
      </p>
    </form>
  </div>
</div>
