<div class="container py-5">
  <h1 class="h3 mb-4 text-center">Contact Us</h1>

  <div class="row g-5 justify-content-center">
    <div class="col-lg-6">
      <form class="js-placeholder-form" novalidate>
        <div class="mb-3">
          <label class="form-label small">Full Name</label>
          <input type="text" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label small">Email Address</label>
          <input type="email" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label small">Subject</label>
          <input type="text" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label small">Message</label>
          <textarea class="form-control" rows="4" required></textarea>
        </div>

        <div class="alert alert-light border small js-placeholder-note d-none">
          <i class="bi bi-info-circle"></i>
          Thanks! This form will send messages to our team once the backend is connected.
        </div>

        <button type="submit" class="btn btn-petly-primary">Send Message</button>
      </form>
    </div>

    <div class="col-lg-5">
      <div class="card card-petly p-4 h-100">
        <h2 class="h6 mb-3">Visit Our Store</h2>
        <p class="small mb-2"><i class="bi bi-geo-alt text-petly-secondary"></i> Francuske revolucije bb, Sarajevo, Bosnia and Herzegovina</p>
        <p class="small mb-2"><i class="bi bi-telephone text-petly-secondary"></i> +387 61 234 567</p>
        <p class="small mb-2"><i class="bi bi-envelope text-petly-secondary"></i> hello@petly.ba</p>
        <p class="small mb-3"><i class="bi bi-clock text-petly-secondary"></i> Mon – Sat, 09:00 – 19:00</p>
        <div class="d-flex gap-3 fs-5">
          <a href="#" class="text-petly-secondary"><i class="bi bi-facebook"></i></a>
          <a href="#" class="text-petly-secondary"><i class="bi bi-instagram"></i></a>
          <a href="#" class="text-petly-secondary"><i class="bi bi-tiktok"></i></a>
        </div>
      </div>
    </div>
  </div>
</div>
