<div class="container py-5">
  <div class="auth-card card card-petly p-4 p-md-5">
    <h1 class="h4 text-center mb-1">Create Your Account</h1>
    <p class="text-muted text-center small mb-4">Join Petly and shop for your pet</p>

    <form class="js-placeholder-form" novalidate>
      <div class="mb-3">
        <label class="form-label small">Full Name</label>
        <input type="text" class="form-control" required />
      </div>
      <div class="mb-3">
        <label class="form-label small">Email Address</label>
        <input type="email" class="form-control" required />
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label small">Password</label>
          <input type="password" class="form-control" required />
        </div>
        <div class="col-md-6">
          <label class="form-label small">Confirm Password</label>
          <input type="password" class="form-control" required />
        </div>
      </div>
      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="agreeTerms" required />
        <label class="form-check-label small" for="agreeTerms">I agree to the Terms &amp; Conditions</label>
      </div>

      <div class="alert alert-light border small js-placeholder-note d-none">
        <i class="bi bi-info-circle"></i>
        Registration will be connected to the backend (with password hashing) in Milestone 4.
      </div>

      <button type="submit" class="btn btn-petly-primary w-100 mb-3">Register</button>
      <p class="text-center small text-muted mb-0">
        Already have an account? <a href="#/login" class="text-petly-primary">Log In</a>
      </p>
    </form>
  </div>
</div>
