<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7 text-center mb-4">
      <div class="fs-1 text-petly-secondary mb-2"><i class="bi bi-check-circle-fill"></i></div>
      <h1 class="h3 mb-2">Thank you, <span id="orderCustomerName">there</span>!</h1>
      <p class="text-muted mb-0">
        Your order <strong>#<span id="orderNumber">-</span></strong> has been received.
      </p>
    </div>

    <div class="col-lg-7">
      <div class="card card-petly p-4 mb-4">
        <h2 class="h6 mb-2">Delivery Details</h2>
        <p class="small mb-1"><i class="bi bi-geo-alt"></i> <span id="orderAddress">-</span></p>
        <p class="small mb-0"><i class="bi bi-telephone"></i> We'll call <span id="orderPhone">-</span> to confirm before dispatch.</p>
      </div>

      <div class="card card-petly p-4 mb-4">
        <h2 class="h6 mb-3">Order Summary</h2>
        <div id="orderSummaryBox"></div>
      </div>

      <p class="small text-muted text-center">
        Payment is collected in cash on delivery. We currently deliver only within
        Bosnia and Herzegovina.
      </p>

      <div class="d-flex justify-content-center gap-3 mt-4">
        <a href="#/shop" class="btn btn-petly-outline">Back to Shop</a>
        <a href="#/profile" class="btn btn-petly-primary">View My Orders</a>
      </div>
    </div>
  </div>
</div>
