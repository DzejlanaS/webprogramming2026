<div class="container py-5">
  <h1 class="h3 mb-4">Your Cart</h1>

  <div id="cartEmpty" class="text-center py-5 d-none">
    <div class="fs-1 mb-3 text-petly-secondary"><i class="bi bi-basket3"></i></div>
    <p class="text-muted">Your cart is empty.</p>
    <a href="#/shop" class="btn btn-petly-primary">Browse Products</a>
  </div>

  <div id="cartTableWrap" class="row g-4 d-none">
    <div class="col-lg-8">
      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>Product</th>
              <th>Price</th>
              <th>Qty</th>
              <th>Subtotal</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="cartBody"></tbody>
        </table>
      </div>
      <a href="#/shop" class="small text-petly-primary"><i class="bi bi-arrow-left"></i> Continue Shopping</a>
    </div>

    <div class="col-lg-4">
      <div class="card card-petly p-4">
        <h2 class="h6 mb-3">Order Summary</h2>
        <div class="d-flex justify-content-between small mb-2">
          <span>Subtotal</span>
          <span id="cartSubtotal">0,00 KM</span>
        </div>
        <div class="d-flex justify-content-between small mb-2 text-muted">
          <span>Delivery</span>
          <span>Calculated at checkout</span>
        </div>
        <hr />
        <div class="d-flex justify-content-between fw-bold mb-3">
          <span>Total</span>
          <span id="cartTotal">0,00 KM</span>
        </div>
        <a href="#/checkout" class="btn btn-petly-primary w-100">
          Proceed to Checkout <i class="bi bi-arrow-right"></i>
        </a>
      </div>
    </div>
  </div>
</div>
